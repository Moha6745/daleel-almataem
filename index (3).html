<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دليل المطاعم — مطاعم الرياض</title>
<meta name="description" content="دليل مطاعم الرياض: تصفح حسب المنطقة ونوع الطعام، شوف المنيو والتقييمات، وقارن أسعار جاهز وهنقرستيشن وكيتا.">
<meta name="theme-color" content="#FFCC00">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23FFCC00'/><text y='.9em' x='50' text-anchor='middle' font-size='62'>&#127869;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#FFCC00;
  --yellow-deep:#F2B705;
  --ink:#141414;
  --ink-soft:#5C5C5C;
  --line:#E8E8E8;
  --bg:#F6F6F4;
  --card:#FFFFFF;
  --green:#0E9F6E;
  --green-bg:#E7F7F0;
  --red:#D93F3F;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Tajawal',-apple-system,'Segoe UI',Arial,sans-serif;
  background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;
  line-height:1.6;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:6px}

/* ---------- الهيكل ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}

header.top{
  background:var(--yellow);
  border-bottom:3px solid var(--ink);
  position:sticky;top:0;z-index:50;
}
.top-in{display:flex;align-items:center;gap:14px;padding:14px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;letter-spacing:-.5px}
.brand .mark{
  width:38px;height:38px;background:var(--ink);color:var(--yellow);
  border-radius:12px;display:grid;place-items:center;font-size:20px;
}
.brand small{display:block;font-size:11px;font-weight:500;opacity:.7;letter-spacing:0}
.search{
  flex:1;min-width:230px;display:flex;align-items:center;gap:8px;
  background:#fff;border:2px solid var(--ink);border-radius:14px;padding:9px 14px;
}
.search input{border:none;outline:none;width:100%;font-size:15px;background:transparent}
.city-pill{
  background:var(--ink);color:#fff;border-radius:999px;
  padding:8px 16px;font-size:13px;font-weight:700;white-space:nowrap;
}

/* ---------- شريط التنبيه ---------- */
.notice{
  background:var(--ink);color:#EDEDED;font-size:12.5px;
  padding:8px 0;text-align:center;
}
.notice b{color:var(--yellow)}

/* ---------- الفلاتر ---------- */
.filters{padding:22px 0 6px}
.frow{margin-bottom:14px}
.flabel{font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  border:2px solid var(--line);background:#fff;border-radius:999px;
  padding:7px 16px;font-size:14px;font-weight:500;transition:.15s;
}
.chip:hover{border-color:#CFCFCF}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.chip .em{margin-left:5px}

.bar{
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;flex-wrap:wrap;margin:18px 0 14px;
}
.count{font-size:14px;color:var(--ink-soft)}
.count b{color:var(--ink);font-size:16px}
.sort{display:flex;align-items:center;gap:8px;font-size:14px}
.sort select{
  border:2px solid var(--line);background:#fff;border-radius:10px;
  padding:7px 12px;font-size:14px;font-weight:500;
}

/* ---------- شبكة المطاعم ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding-bottom:50px}
.rcard{
  background:var(--card);border-radius:18px;overflow:hidden;
  border:1px solid var(--line);text-align:right;width:100%;
  display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s;
}
.rcard:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.09)}
.thumb{
  height:120px;display:grid;place-items:center;font-size:52px;position:relative;
}
.thumb .reg{
  position:absolute;top:10px;left:10px;background:rgba(20,20,20,.82);color:#fff;
  font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;
}
.rbody{padding:14px 15px 15px;flex:1;display:flex;flex-direction:column}
.rname{font-size:17.5px;font-weight:800;margin-bottom:3px}
.rmeta{font-size:13px;color:var(--ink-soft);margin-bottom:10px}
.rstats{display:flex;align-items:center;gap:12px;font-size:13.5px;margin-bottom:12px;flex-wrap:wrap}
.star{color:var(--yellow-deep);font-weight:800}
.dot{color:#CACACA}
.best{
  background:var(--green-bg);border-radius:12px;padding:9px 11px;
  font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-top:auto;
}
.best .lbl{color:#0A7A55;font-weight:500}
.best .val{font-weight:800;color:#076B4B}
.apps{display:flex;gap:5px;margin-bottom:11px;flex-wrap:wrap}
.apptag{
  font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:7px;
  border:1.5px solid var(--line);color:var(--ink-soft);
}
.apptag.off{opacity:.35;text-decoration:line-through}

.empty{
  grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--ink-soft);
}
.empty .big{font-size:44px;margin-bottom:12px}
.empty h3{font-size:19px;color:var(--ink);margin-bottom:6px}

/* ---------- صفحة المطعم ---------- */
.back{
  display:inline-flex;align-items:center;gap:7px;margin:20px 0 16px;
  font-weight:700;font-size:14.5px;background:#fff;border:2px solid var(--ink);
  border-radius:12px;padding:8px 16px;
}
.hero{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  overflow:hidden;margin-bottom:18px;
}
.hero-top{height:150px;display:grid;place-items:center;font-size:70px}
.hero-in{padding:18px 22px 20px}
.hero h1{font-size:28px;font-weight:900;letter-spacing:-.5px}
.hero .sub{color:var(--ink-soft);font-size:14.5px;margin:4px 0 14px}
.hero .about{font-size:15px;color:#3A3A3A;max-width:70ch;margin-bottom:16px}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{
  background:var(--bg);border-radius:14px;padding:10px 16px;min-width:96px;
}
.kpi .n{font-size:19px;font-weight:900;line-height:1.2}
.kpi .l{font-size:12px;color:var(--ink-soft)}

.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{
  padding:11px 18px;font-size:15px;font-weight:700;color:var(--ink-soft);
  border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--yellow)}

.panel{padding-bottom:60px}
.sec-h{font-size:19px;font-weight:800;margin-bottom:6px}
.sec-p{font-size:14px;color:var(--ink-soft);margin-bottom:16px;max-width:66ch}

/* المنيو */
.mitem{
  background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:14px 16px;margin-bottom:10px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;
}
.mitem.picked{border-color:var(--yellow-deep);background:#FFFDF2}
.mcheck{
  width:24px;height:24px;border:2px solid #D5D5D5;border-radius:8px;
  display:grid;place-items:center;flex-shrink:0;font-size:14px;color:transparent;
}
.mitem.picked .mcheck{background:var(--yellow);border-color:var(--yellow-deep);color:var(--ink)}
.minfo{flex:1;min-width:150px}
.minfo .n{font-weight:700;font-size:15.5px}
.minfo .d{font-size:13px;color:var(--ink-soft)}
.mprices{display:flex;gap:7px;flex-wrap:wrap}
.pp{
  border:1.5px solid var(--line);border-radius:10px;padding:5px 10px;
  text-align:center;min-width:76px;
}
.pp .a{font-size:11px;color:var(--ink-soft);font-weight:500}
.pp .v{font-size:14.5px;font-weight:800}
.pp.low{border-color:var(--green);background:var(--green-bg)}
.pp.low .a{color:#0A7A55}
.pp.na{opacity:.4}

/* المقارنة */
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:20px}
.ccard{
  background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px;
  position:relative;
}
.ccard.win{border-color:var(--green)}
.ccard.na{opacity:.55}
.ribbon{
  position:absolute;top:-11px;right:16px;background:var(--green);color:#fff;
  font-size:11.5px;font-weight:800;padding:3px 12px;border-radius:999px;
}
.ccard h4{font-size:17px;font-weight:800;margin-bottom:12px}
.line{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;color:var(--ink-soft)}
.line b{color:var(--ink);font-weight:700}
.total{
  border-top:2px dashed var(--line);margin-top:9px;padding-top:11px;
  display:flex;justify-content:space-between;align-items:baseline;
}
.total .t{font-size:14px;font-weight:700}
.total .v{font-size:24px;font-weight:900}
.markup{font-size:12px;color:var(--ink-soft);margin-top:7px}

.verdict{
  background:var(--ink);color:#fff;border-radius:20px;padding:22px 24px;margin-bottom:22px;
}
.verdict .k{font-size:13px;color:var(--yellow);font-weight:700;margin-bottom:5px}
.verdict h3{font-size:23px;font-weight:900;margin-bottom:8px}
.verdict p{font-size:14.5px;color:#C9C9C9;max-width:62ch}
.verdict .save{color:var(--yellow);font-weight:800}

.basketbar{
  background:#FFFBE6;border:2px solid var(--yellow);border-radius:14px;
  padding:11px 16px;font-size:14px;margin-bottom:16px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
}
.basketbar button{font-weight:700;font-size:13.5px;text-decoration:underline}

/* التقييمات */
.rev-top{display:flex;gap:26px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.score{text-align:center}
.score .n{font-size:52px;font-weight:900;line-height:1}
.score .s{color:var(--yellow-deep);font-size:17px}
.score .c{font-size:13px;color:var(--ink-soft);margin-top:2px}
.bars{flex:1;min-width:220px}
.brow{display:flex;align-items:center;gap:9px;font-size:13px;margin-bottom:4px}
.btrack{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bfill{height:100%;background:var(--yellow);border-radius:99px}

.review{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 17px;margin-bottom:10px}
.rvh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px;flex-wrap:wrap}
.avatar{
  width:34px;height:34px;border-radius:50%;background:var(--yellow);
  display:grid;place-items:center;font-weight:800;font-size:14px;flex-shrink:0;
}
.rvwho{display:flex;align-items:center;gap:9px}
.rvwho .nm{font-weight:700;font-size:14.5px}
.rvwho .dt{font-size:12px;color:var(--ink-soft)}
.review p{font-size:14.5px;color:#3A3A3A}

.addbox{background:#fff;border:2px dashed var(--line);border-radius:16px;padding:17px;margin-top:18px}
.addbox h4{font-size:16px;font-weight:800;margin-bottom:12px}
.stars-pick{display:flex;gap:4px;margin-bottom:11px;font-size:26px}
.stars-pick button{color:#DDD;line-height:1}
.stars-pick button.on{color:var(--yellow-deep)}
.addbox input,.addbox textarea{
  width:100%;border:2px solid var(--line);border-radius:11px;
  padding:9px 12px;font-size:14.5px;margin-bottom:9px;outline:none;resize:vertical;
}
.addbox input:focus,.addbox textarea:focus{border-color:var(--ink)}
.submit{
  background:var(--yellow);border:2px solid var(--ink);border-radius:12px;
  padding:9px 24px;font-weight:800;font-size:15px;
}

footer{border-top:1px solid var(--line);padding:26px 0;font-size:13px;color:var(--ink-soft);text-align:center}

@media(max-width:640px){
  .hero h1{font-size:23px}
  .thumb{height:104px;font-size:44px}
  .mprices{width:100%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    return {key:k, on:true, sub:money(sub), fee:a.fee, total:money(sub+a.fee), mult:a.mult};
  });
  const live = rows.filter(r=>r.on);
  const best = live.length ? live.reduce((m,r)=> r.total < m.total ? r : m) : null;
  const worst = live.length ? live.reduce((m,r)=> r.total > m.total ? r : m) : null;
  return {rows, best, worst, saving: best&&worst ? money(worst.total-best.total) : 0};
}
function item2(it,a){ return it.base * a.mult; }

// أرخص تطبيق بناءً على المنيو كامل (يُستخدم في البطاقات)
function bestApp(rest){
  return compare(rest, rest.menu).best;
}

/* ==========================================================
   الحالة
   ========================================================== */
const state = {
  view:"list", id:null, tab:"menu",
  region:"الكل", cuisine:"الكل", q:"", sort:"rating",
  basket:{}, // id -> Set of item indexes
  newRating:0,
  extraReviews:{}
};

const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = document.getElementById('app');

/* ==========================================================
   عرض القائمة
   ========================================================== */
function filtered(){
  let out = DATA.filter(r=>{
    if(state.region!=="الكل" && r.region!==state.region) return false;
    if(state.cuisine!=="الكل" && r.cuisine!==state.cuisine) return false;
    if(state.q){
      const q = state.q.trim();
      if(!(r.name.includes(q) || r.cuisine.includes(q) || r.district.includes(q))) return false;
    }
    return true;
  });
  if(state.sort==="rating") out.sort((a,b)=>b.rating-a.rating);
  if(state.sort==="cheap") out.sort((a,b)=>{
    const A=bestApp(a), B=bestApp(b);
    return (A?A.total:1e9)-(B?B.total:1e9);
  });
  if(state.sort==="reviews") out.sort((a,b)=>b.reviewsCount-a.reviewsCount);
  return out;
}

function chipRow(label, values, current, action){
  return `<div class="frow">
    <div class="flabel">${label}</div>
    <div class="chips">
      ${values.map(v=>`<button class="chip" aria-pressed="${v===current}" data-act="${action}" data-val="${esc(v)}">
        ${CUISINE_EMOJI[v]?`<span class="em">${CUISINE_EMOJI[v]}</span>`:''}${esc(v)}
      </button>`).join('')}
    </div>
  </div>`;
}

function renderList(){
  const list = filtered();
  app.innerHTML = `
  <section class="filters">
    ${chipRow("المنطقة", REGIONS, state.region, "region")}
    ${chipRow("نوع الطعام", CUISINES, state.cuisine, "cuisine")}
  </section>

  <div class="bar">
    <div class="count"><b>${fmt(list.length)}</b> مطعم مطابق</div>
    <label class="sort">ترتيب حسب
      <select id="sort">
        <option value="rating" ${state.sort==='rating'?'selected':''}>الأعلى تقييماً</option>
        <option value="cheap" ${state.sort==='cheap'?'selected':''}>الأوفر سعراً</option>
        <option value="reviews" ${state.sort==='reviews'?'selected':''}>الأكثر تقييمات</option>
      </select>
    </label>
  </div>

  <div class="grid">
    ${list.length ? list.map(cardHTML).join('') : `
      <div class="empty">
        <div class="big">🍽</div>
        <h3>ما فيه مطاعم بهذي الفلاتر</h3>
        <p>جرّب توسيع المنطقة أو تغيير نوع الطعام.</p>
      </div>`}
  </div>`;
}

function cardHTML(r){
  const b = bestApp(r);
  return `<button class="rcard" data-act="open" data-id="${r.id}">
    <div class="thumb" style="background:${CUISINE_BG[r.cuisine]}">
      ${CUISINE_EMOJI[r.cuisine]}
      <span class="reg">${esc(r.region)} · ${esc(r.district)}</span>
    </div>
    <div class="rbody">
      <div class="rname">${esc(r.name)}</div>
      <div class="rmeta">${esc(r.cuisine)} · ${esc(r.price)}</div>
      <div class="rstats">
        <span><span class="star">★ ${r.rating}</span> <span style="color:var(--ink-soft)">(${fmt(r.reviewsCount)})</span></span>
        <span class="dot">|</span>
        <span>🛵 ${esc(r.eta)}</span>
      </div>
      <div class="apps">
        ${APP_KEYS.map(k=>`<span class="apptag ${r.apps[k].on?'':'off'}">${APPS[k].short}</span>`).join('')}
      </div>
      ${b ? `<div class="best">
        <span class="lbl">الأوفر للمنيو كامل</span>
        <span class="val">${APPS[b.key].name} · ${fmt(b.total)} ر.س</span>
      </div>` : ''}
    </div>
  </button>`;
}

/* ==========================================================
   صفحة المطعم
   ========================================================== */
function getRest(){ return DATA.find(r=>r.id===state.id); }
function basketSet(){
  if(!state.basket[state.id]) state.basket[state.id] = new Set(getRest().menu.map((_,i)=>i));
  return state.basket[state.id];
}

function renderDetail(){
  const r = getRest();
  const sel = basketSet();
  app.innerHTML = `
  <button class="back" data-act="back">→ رجوع للقائمة</button>
  <section class="hero">
    <div class="hero-top" style="background:${CUISINE_BG[r.cuisine]}">${CUISINE_EMOJI[r.cuisine]}</div>
    <div class="hero-in">
      <h1>${esc(r.name)}</h1>
      <div class="sub">${esc(r.cuisine)} · ${esc(r.district)} · ${esc(r.region)} الرياض</div>
      <p class="about">${esc(r.about)}</p>
      <div class="kpis">
        <div class="kpi"><div class="n">★ ${r.rating}</div><div class="l">${fmt(r.reviewsCount)} تقييم</div></div>
        <div class="kpi"><div class="n">${esc(r.eta)}</div><div class="l">وقت التوصيل</div></div>
        <div class="kpi"><div class="n">${esc(r.price)}</div><div class="l">مستوى السعر</div></div>
        <div class="kpi"><div class="n">${APP_KEYS.filter(k=>r.apps[k].on).length}</div><div class="l">تطبيقات متاحة</div></div>
      </div>
    </div>
  </section>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="${state.tab==='menu'}" data-act="tab" data-val="menu">قائمة الطعام</button>
    <button class="tab" role="tab" aria-selected="${state.tab==='cmp'}" data-act="tab" data-val="cmp">مقارنة التطبيقات</button>
    <button class="tab" role="tab" aria-selected="${state.tab==='rev'}" data-act="tab" data-val="rev">التقييمات والآراء</button>
  </div>

  <div class="panel">${
    state.tab==='menu' ? menuHTML(r,sel) :
    state.tab==='cmp'  ? cmpHTML(r,sel)  : revHTML(r)
  }</div>`;
}

function menuHTML(r,sel){
  return `
  <h2 class="sec-h">قائمة الطعام</h2>
  <p class="sec-p">كل صنف معروض بسعره داخل كل تطبيق. الخانة الخضراء هي الأرخص لهذا الصنف. حدّد الأصناف اللي تبي تطلبها وانتقل لتبويب المقارنة عشان تعرف أي تطبيق يطلع أوفر لطلبك أنت.</p>
  <div class="basketbar">
    <span>محدَّد <b>${sel.size}</b> من ${r.menu.length} صنف</span>
    <span>
      <button data-act="all">تحديد الكل</button> ·
      <button data-act="none">إلغاء الكل</button>
    </span>
  </div>
  ${r.menu.map((it,i)=>{
    const prices = APP_KEYS.map(k=>({k, v:itemPrice(r,it,k)}));
    const live = prices.filter(p=>p.v!==null);
    const min = live.length ? Math.min(...live.map(p=>p.v)) : null;
    return `<div class="mitem ${sel.has(i)?'picked':''}">
      <button class="mcheck" data-act="pick" data-i="${i}" aria-label="تحديد ${esc(it.n)}" aria-pressed="${sel.has(i)}">✓</button>
      <div class="minfo">
        <div class="n">${esc(it.n)}</div>
        ${it.d?`<div class="d">${esc(it.d)}</div>`:''}
      </div>
      <div class="mprices">
        ${prices.map(p=>`<div class="pp ${p.v===null?'na':(p.v===min?'low':'')}">
          <div class="a">${APPS[p.k].short}</div>
          <div class="v">${p.v===null?'—':fmt(p.v)}</div>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('')}
  <p class="sec-p" style="margin-top:14px">الأسعار بالريال السعودي وتشمل زيادة التطبيق على سعر الفرع، ولا تشمل رسوم التوصيل.</p>`;
}

function cmpHTML(r,sel){
  const items = r.menu.filter((_,i)=>sel.has(i));
  if(!items.length){
    return `<div class="empty"><div class="big">🧾</div><h3>ما حددت أي صنف</h3>
      <p>ارجع لتبويب قائمة الطعام واختر الأصناف اللي تبي تطلبها.</p></div>`;
  }
  const c = compare(r, items);
  const b = c.best;
  return `
  ${b ? `<div class="verdict">
    <div class="k">التوصية</div>
    <h3>اطلب من ${APPS[b.key].name}</h3>
    <p>لهذا الطلب (${items.length} صنف)، ${APPS[b.key].name} يطلع الأوفر بإجمالي <span class="save">${fmt(b.total)} ر.س</span> شامل التوصيل${c.saving>0?`، أي بتوفير <span class="save">${fmt(c.saving)} ر.س</span> مقارنة بأغلى تطبيق متاح.`:'.'}</p>
  </div>`:''}

  <div class="cmp">
    ${c.rows.map(row=>{
      if(!row.on) return `<div class="ccard na">
        <h4>${APPS[row.key].name}</h4>
        <p style="font-size:14px;color:var(--ink-soft)">المطعم غير متوفر على هذا التطبيق حالياً.</p>
      </div>`;
      const win = b && row.key===b.key;
      return `<div class="ccard ${win?'win':''}">
        ${win?'<span class="ribbon">الأوفر</span>':''}
        <h4>${APPS[row.key].name}</h4>
        <div class="line"><span>قيمة الأصناف</span><b>${fmt(row.sub)} ر.س</b></div>
        <div class="line"><span>رسوم التوصيل</span><b>${row.fee===0?'مجاني':fmt(row.fee)+' ر.س'}</b></div>
        <div class="total"><span class="t">الإجمالي</span><span class="v">${fmt(row.total)}</span></div>
        <div class="markup">زيادة عن سعر الفرع: ${Math.round((row.mult-1)*100)}%</div>
      </div>`;
    }).join('')}
  </div>

  <h2 class="sec-h">كيف تُحسب المقارنة؟</h2>
  <p class="sec-p">نأخذ سعر الصنف في الفرع ونضربه في نسبة الزيادة المسجّلة لكل تطبيق، نجمع الأصناف المحددة، ثم نضيف رسوم التوصيل. المقارنة لا تحسب كوبونات الخصم ولا اشتراكات التوصيل المجاني، وهذي غالباً تقلب النتيجة — فراجع العروض قبل ما تعتمد التوصية.</p>`;
}

function revHTML(r){
  const extra = state.extraReviews[r.id] || [];
  const all = [...extra, ...r.reviews];
  const dist = [5,4,3,2,1].map(s=>({s, n:all.filter(v=>v.r===s).length}));
  const max = Math.max(1,...dist.map(d=>d.n));
  return `
  <h2 class="sec-h">آراء الزوار</h2>
  <p class="sec-p">تقييمات مبنية على تجارب زوار المنصة داخل الفرع وعبر التوصيل.</p>
  <div class="rev-top">
    <div class="score">
      <div class="n">${r.rating}</div>
      <div class="s">${'★'.repeat(Math.round(r.rating))}${'☆'.repeat(5-Math.round(r.rating))}</div>
      <div class="c">${fmt(r.reviewsCount)} تقييم</div>
    </div>
    <div class="bars">
      ${dist.map(d=>`<div class="brow">
        <span style="width:34px">${d.s} ★</span>
        <span class="btrack"><span class="bfill" style="width:${(d.n/max*100)||0}%"></span></span>
        <span style="width:22px;color:var(--ink-soft)">${d.n}</span>
      </div>`).join('')}
    </div>
  </div>

  ${all.map(v=>`<article class="review">
    <div class="rvh">
      <div class="rvwho">
        <span class="avatar">${esc(v.who.trim()[0]||'؟')}</span>
        <span><span class="nm">${esc(v.who)}</span><br><span class="dt">${esc(v.dt)}</span></span>
      </div>
      <span class="star">${'★'.repeat(v.r)}<span style="color:#DDD">${'★'.repeat(5-v.r)}</span></span>
    </div>
    <p>${esc(v.t)}</p>
  </article>`).join('')}

  <div class="addbox">
    <h4>شارك تجربتك</h4>
    <div class="stars-pick" id="pick">
      ${[1,2,3,4,5].map(i=>`<button data-act="star" data-val="${i}" class="${state.newRating>=i?'on':''}" aria-label="${i} نجوم">★</button>`).join('')}
    </div>
    <input id="rv-name" placeholder="اسمك" maxlength="30">
    <textarea id="rv-text" rows="3" placeholder="كيف كانت التجربة؟ الطعم، السعر، وقت التوصيل…" maxlength="400"></textarea>
    <button class="submit" data-act="send">أضف التقييم</button>
  </div>`;
}

/* ==========================================================
   التفاعل
   ========================================================== */
function render(){
  window.scrollTo({top:0,behavior:'instant'});
  state.view==='list' ? renderList() : renderDetail();
}

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act, val = el.dataset.val;

  if(act==='region'){ state.region=val; render(); }
  else if(act==='cuisine'){ state.cuisine=val; render(); }
  else if(act==='open'){ state.view='detail'; state.id=el.dataset.id; state.tab='menu'; state.newRating=0; render(); }
  else if(act==='back'){ state.view='list'; render(); }
  else if(act==='tab'){ state.tab=val; render(); }
  else if(act==='pick'){
    const s=basketSet(), i=+el.dataset.i;
    s.has(i)?s.delete(i):s.add(i); render();
  }
  else if(act==='all'){ state.basket[state.id]=new Set(getRest().menu.map((_,i)=>i)); render(); }
  else if(act==='none'){ state.basket[state.id]=new Set(); render(); }
  else if(act==='star'){ state.newRating=+val; render(); }
  else if(act==='send'){
    const nm=(document.getElementById('rv-name').value||'زائر').trim();
    const tx=(document.getElementById('rv-text').value||'').trim();
    if(!state.newRating){ alert('اختر عدد النجوم أولاً.'); return; }
    if(tx.length<5){ alert('اكتب رأيك في جملة على الأقل.'); return; }
    (state.extraReviews[state.id] ||= []).unshift({who:nm, r:state.newRating, dt:'الآن', t:tx});
    state.newRating=0; render();
  }
});

document.addEventListener('change', e=>{
  if(e.target.id==='sort'){ state.sort=e.target.value; render(); }
});

let t;
document.getElementById('q').addEventListener('input', e=>{
  clearTimeout(t);
  t=setTimeout(()=>{ state.q=e.target.value; state.view='list'; render(); },180);
});

render();
</script>
</body>
</html>
